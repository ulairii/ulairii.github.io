<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 515" role="img" aria-labelledby="title desc"><title id="title">Coordinate tasks around the driving objective</title><desc id="desc">Structured perception and prediction share information with planning while keeping task supervision.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="515" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">Coordinate tasks around the driving objective</text><rect x="30" y="75" width="660" height="65" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="360.0" y="104" font-size="21" fill="#172033" text-anchor="middle">Sensor features</text><rect x="30" y="210" width="195" height="95" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="127.5" y="239" font-size="21" fill="#172033" text-anchor="middle">Objects / tracks</text><text x="127.5" y="266" font-size="21" fill="#172033" text-anchor="middle">Road map</text><rect x="265" y="210" width="195" height="95" rx="6" fill="#f0fdf4" stroke="#94a3b8" stroke-width="2"/><text x="362.5" y="239" font-size="21" fill="#172033" text-anchor="middle">Future motion</text><text x="362.5" y="266" font-size="21" fill="#172033" text-anchor="middle">Occupancy</text><rect x="500" y="210" width="195" height="95" rx="6" fill="#fff7ed" stroke="#94a3b8" stroke-width="2"/><text x="597.5" y="239" font-size="21" fill="#172033" text-anchor="middle">Our trajectory</text><text x="597.5" y="266" font-size="21" fill="#172033" text-anchor="middle">Planning</text><path d="M360 145L125 202" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 145L360 202" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 145L595 202" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M230 255L257 255" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M465 255L492 255" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="125" y="364" font-size="20" fill="#172033" text-anchor="middle">Perception loss</text><path d="M125 310L125 336" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="364" font-size="20" fill="#172033" text-anchor="middle">Prediction loss</text><path d="M360 310L360 336" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/><text x="595" y="364" font-size="20" fill="#172033" text-anchor="middle">Planning loss</text><path d="M595 310L595 336" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="430" font-size="22" fill="#172033" text-anchor="start">Shared training can retain named intermediate outputs.</text><text x="30" y="478" font-size="22" fill="#172033" text-anchor="start">Execution still needs control and new observations.</text></g></svg>
