<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 535" role="img" aria-labelledby="title desc"><title id="title">Where sensor information meets</title><desc id="desc">Camera and lidar encoders make aligned BEV features for joint prediction; late fusion instead joins final detections.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="535" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">Where sensor information meets</text><rect x="25" y="80" width="290" height="65" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="170.0" y="109" font-size="21" fill="#172033" text-anchor="middle">Camera → BEV features</text><rect x="405" y="80" width="290" height="65" rx="6" fill="#f0fdf4" stroke="#94a3b8" stroke-width="2"/><text x="550.0" y="109" font-size="21" fill="#172033" text-anchor="middle">Lidar → BEV features</text><path d="M170 151L330 211" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 151L390 211" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="200" y="225" width="320" height="85" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="360.0" y="254" font-size="21" fill="#172033" text-anchor="middle">Align and combine</text><text x="360.0" y="281" font-size="21" fill="#172033" text-anchor="middle">Then predict objects</text><path d="M25 348L695 348" fill="none" stroke="#cbd5e1" stroke-width="2"/><text x="25" y="386" font-size="23" fill="#172033" text-anchor="start" font-weight="bold">Late fusion:</text><rect x="25" y="408" width="210" height="75" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="130.0" y="437" font-size="21" fill="#172033" text-anchor="middle">Camera detections</text><rect x="485" y="408" width="210" height="75" rx="6" fill="#f0fdf4" stroke="#94a3b8" stroke-width="2"/><text x="590.0" y="437" font-size="21" fill="#172033" text-anchor="middle">Lidar detections</text><text x="270" y="452" font-size="23" fill="#172033" text-anchor="start">Associate</text><path d="M240 445L264 445" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M481 445L405 445" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
