<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">No return behind a surface does not mean empty</title><desc id="desc">A ray crosses observed free cells, reaches an occupied surface, and leaves unknown space beyond.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="430" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">No return behind a surface does not mean empty</text><circle cx="35" cy="200" r="10" fill="#475569"/><text x="25" y="130" font-size="22" fill="#172033" text-anchor="start">Sensor</text><rect x="95" y="165" width="65" height="70" rx="0" fill="#d1fae5" stroke="#94a3b8" stroke-width="2"/><rect x="160" y="165" width="65" height="70" rx="0" fill="#d1fae5" stroke="#94a3b8" stroke-width="2"/><rect x="225" y="165" width="65" height="70" rx="0" fill="#d1fae5" stroke="#94a3b8" stroke-width="2"/><rect x="290" y="165" width="65" height="70" rx="0" fill="#d1fae5" stroke="#94a3b8" stroke-width="2"/><rect x="355" y="165" width="65" height="70" rx="0" fill="#ffedd5" stroke="#94a3b8" stroke-width="2"/><rect x="420" y="165" width="65" height="70" rx="0" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><text x="452" y="211" font-size="26" fill="#7c3aed" text-anchor="middle">?</text><rect x="485" y="165" width="65" height="70" rx="0" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><text x="517" y="211" font-size="26" fill="#7c3aed" text-anchor="middle">?</text><rect x="550" y="165" width="65" height="70" rx="0" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><text x="582" y="211" font-size="26" fill="#7c3aed" text-anchor="middle">?</text><rect x="615" y="165" width="65" height="70" rx="0" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><text x="647" y="211" font-size="26" fill="#7c3aed" text-anchor="middle">?</text><path d="M45 200L380 200" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="120" y="280" font-size="22" fill="#047857" text-anchor="start">Observed free</text><text x="330" y="315" font-size="22" fill="#c2410c" text-anchor="start">Surface</text><text x="485" y="280" font-size="22" fill="#7c3aed" text-anchor="start">Unknown</text><text x="25" y="379" font-size="21" fill="#172033" text-anchor="start">A benchmark may encode unknown with a visibility mask.</text></g></svg>
