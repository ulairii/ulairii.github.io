<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img" aria-labelledby="title desc"><title id="title">Match the evidence to the claim</title><desc id="desc">Evaluation examines data independence, component predictions, timing and degradation, then closed-loop behavior.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="530" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">Match the evidence to the claim</text><rect x="30" y="70" width="660" height="83" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="360.0" y="99" font-size="21" fill="#172033" text-anchor="middle">1. Data and labels</text><text x="360.0" y="126" font-size="21" fill="#172033" text-anchor="middle">Independent splits; valid targets</text><path d="M360 157L360 175" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="180" width="660" height="83" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="360.0" y="209" font-size="21" fill="#172033" text-anchor="middle">2. Component outputs</text><text x="360.0" y="236" font-size="21" fill="#172033" text-anchor="middle">Geometry, semantics, identity, motion</text><path d="M360 267L360 285" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="290" width="660" height="83" rx="6" fill="#f0fdf4" stroke="#94a3b8" stroke-width="2"/><text x="360.0" y="319" font-size="21" fill="#172033" text-anchor="middle">3. Timing and degradation</text><text x="360.0" y="346" font-size="21" fill="#172033" text-anchor="middle">Latency, missing inputs, recovery</text><path d="M360 377L360 395" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="400" width="660" height="83" rx="6" fill="#fff7ed" stroke="#94a3b8" stroke-width="2"/><text x="360.0" y="429" font-size="21" fill="#172033" text-anchor="middle">4. Closed-loop behavior</text><text x="360.0" y="456" font-size="21" fill="#172033" text-anchor="middle">Actions change later observations</text><text x="30" y="515" font-size="20" fill="#172033" text-anchor="start">A strong result at one level does not prove every other level.</text></g></svg>
