<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 635" role="img" aria-labelledby="title desc"><title id="title">The main driving tasks</title><desc id="desc">A simplified vertical flow from sensor measurements through perception, tracking, prediction, planning and control. Position, map and route also inform these tasks.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#334155"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#a78bfa" stroke-width="2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" fill="#172033" font-size="20"><text x="32" y="36" font-size="20">From measurements to action</text><rect x="35" y="65" width="620" height="72" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="55" y="93" font-weight="bold">Sensor measurements</text><text x="55" y="118" font-size="18">Images, distances, radar returns</text><path d="M345 139V161" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="165" width="620" height="72" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="55" y="193" font-weight="bold">Perception and tracking</text><text x="55" y="218" font-size="18">Objects, road layout, current motion</text><path d="M345 239V261" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="265" width="620" height="72" rx="8" fill="#f0fdf4" stroke="#94a3b8"/><text x="55" y="293" font-weight="bold">Prediction</text><text x="55" y="318" font-size="18">Possible future motion of other road users</text><path d="M345 339V361" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="365" width="620" height="72" rx="8" fill="#fff7ed" stroke="#94a3b8"/><text x="55" y="393" font-weight="bold">Planning</text><text x="55" y="418" font-size="18">Choose our car’s path and speed</text><path d="M345 439V461" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="465" width="620" height="72" rx="8" fill="#fff7ed" stroke="#94a3b8"/><text x="55" y="493" font-weight="bold">Control</text><text x="55" y="518" font-size="18">Steering, braking, acceleration</text><text x="35" y="579" font-size="18">Position, map, and route also inform these tasks.</text><text x="35" y="609" font-size="18">New measurements arrive as the car moves; the process repeats.</text></g></svg>