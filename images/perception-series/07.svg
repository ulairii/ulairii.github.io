<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Three ways to describe the same scene</title><desc id="desc">A bounding box includes background; a semantic mask labels both cars the same; instance masks distinguish them.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="460" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">Three ways to describe the same scene</text><text x="20" y="87" font-size="22" fill="#172033" text-anchor="start" font-weight="bold">Boxes</text><rect x="20" y="112" width="205" height="220" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="42" y="265" width="160" height="45" rx="6" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="2"/><path d="M45 240v-55h20l12 -24h22l15 24v55Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="40" y="152" width="72" height="95" rx="0" fill="none" stroke="#c2410c" stroke-width="2"/><path d="M120 240v-55h20l12 -24h22l15 24v55Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="115" y="152" width="72" height="95" rx="0" fill="none" stroke="#c2410c" stroke-width="2"/><text x="255" y="87" font-size="22" fill="#172033" text-anchor="start" font-weight="bold">Semantic masks</text><rect x="255" y="112" width="205" height="220" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="277" y="265" width="160" height="45" rx="6" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="2"/><path d="M280 240v-55h20l12 -24h22l15 24v55Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M355 240v-55h20l12 -24h22l15 24v55Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="490" y="87" font-size="22" fill="#172033" text-anchor="start" font-weight="bold">Instance masks</text><rect x="490" y="112" width="205" height="220" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="512" y="265" width="160" height="45" rx="6" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="2"/><path d="M515 240v-55h20l12 -24h22l15 24v55Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M590 240v-55h20l12 -24h22l15 24v55Z" fill="#d1fae5" stroke="#047857" stroke-width="3"/><text x="20" y="374" font-size="22" fill="#172033" text-anchor="start">Extent</text><text x="255" y="374" font-size="22" fill="#172033" text-anchor="start">Both: vehicle</text><text x="490" y="374" font-size="22" fill="#172033" text-anchor="start">Car A / Car B</text><text x="20" y="430" font-size="20" fill="#172033" text-anchor="start">A mask remains in image coordinates unless geometry is added.</text></g></svg>
