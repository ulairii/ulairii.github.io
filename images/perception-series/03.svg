<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Learning from examples</title><desc id="desc">During training a prediction is compared with a label. The loss updates parameters. At inference the label is absent.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="480" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">Learning from examples</text><rect x="30" y="80" width="190" height="65" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="125.0" y="109" font-size="21" fill="#172033" text-anchor="middle">Training image</text><rect x="265" y="80" width="190" height="65" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="360.0" y="109" font-size="21" fill="#172033" text-anchor="middle">Model</text><rect x="500" y="80" width="190" height="65" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="595.0" y="109" font-size="21" fill="#172033" text-anchor="middle">Prediction</text><path d="M224 112L257 112" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M459 112L492 112" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="220" width="190" height="65" rx="6" fill="#fff7ed" stroke="#94a3b8" stroke-width="2"/><text x="595.0" y="249" font-size="21" fill="#172033" text-anchor="middle">Compare: loss</text><path d="M595 148L595 212" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="265" y="220" width="190" height="65" rx="6" fill="#f0fdf4" stroke="#94a3b8" stroke-width="2"/><text x="360.0" y="249" font-size="21" fill="#172033" text-anchor="middle">Target label</text><path d="M459 252L492 252" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M595 285V305H70V180H360" fill="none" stroke="#c2410c" stroke-width="2"/><path d="M360 180L360 150" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/><text x="80" y="205" font-size="20" fill="#c2410c" text-anchor="start">Update parameters</text><path d="M25 330L695 330" fill="none" stroke="#cbd5e1" stroke-width="2"/><text x="30" y="365" font-size="23" fill="#172033" text-anchor="start">Inference: new image → trained model → prediction</text><text x="30" y="413" font-size="21" fill="#172033" text-anchor="start">No target label is available to correct this answer.</text></g></svg>
