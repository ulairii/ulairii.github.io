<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 625" role="img" aria-labelledby="title desc"><title id="title">What the approaching car can and cannot see</title><desc id="desc">Illustrative top view of a crossing. The truck hides a region beyond it from the approaching car.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#334155"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#a78bfa" stroke-width="2"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" fill="#172033" font-size="20">
