<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc"><title id="title">Broader data, then task-specific grounding</title><desc id="desc">Pretraining learns features from broad data, while driving supervision teaches metric outputs and task behavior.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="510" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">Broader data, then task-specific grounding</text><rect x="30" y="75" width="300" height="85" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="180.0" y="104" font-size="21" fill="#172033" text-anchor="middle">Images / image-text pairs</text><text x="180.0" y="131" font-size="21" fill="#172033" text-anchor="middle">Broad source data</text><rect x="400" y="75" width="290" height="85" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="545.0" y="104" font-size="21" fill="#172033" text-anchor="middle">Pretrained features</text><path d="M335 115L391 115" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="260" width="300" height="90" rx="6" fill="#f0fdf4" stroke="#94a3b8" stroke-width="2"/><text x="180.0" y="289" font-size="21" fill="#172033" text-anchor="middle">Driving observations</text><text x="180.0" y="316" font-size="21" fill="#172033" text-anchor="middle">Geometry + labels</text><rect x="400" y="260" width="290" height="90" rx="6" fill="#fff7ed" stroke="#94a3b8" stroke-width="2"/><text x="545.0" y="289" font-size="21" fill="#172033" text-anchor="middle">Adapted driving model</text><text x="545.0" y="316" font-size="21" fill="#172033" text-anchor="middle">Metric outputs</text><path d="M545 165L545 250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M335 305L391 305" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="418" font-size="22" fill="#172033" text-anchor="start">Knowing an object name does not establish its distance.</text><text x="30" y="466" font-size="20" fill="#172033" text-anchor="start">Training data and inference inputs must be reported separately.</text></g></svg>
