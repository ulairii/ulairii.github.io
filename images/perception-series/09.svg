<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Order changes; the pooled result does not</title><desc id="desc">Shared point encoding produces features whose channelwise maximum is independent of their order.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="460" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">Order changes; the pooled result does not</text><rect x="25" y="95" width="200" height="160" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="125.0" y="124" font-size="21" fill="#172033" text-anchor="middle">Point features</text><text x="125.0" y="151" font-size="21" fill="#172033" text-anchor="middle">(2, 1)</text><text x="125.0" y="178" font-size="21" fill="#172033" text-anchor="middle">(0, 4)</text><text x="125.0" y="205" font-size="21" fill="#172033" text-anchor="middle">(3, 2)</text><rect x="260" y="125" width="190" height="90" rx="6" fill="#fff7ed" stroke="#94a3b8" stroke-width="2"/><text x="355.0" y="154" font-size="21" fill="#172033" text-anchor="middle">Maximum</text><text x="355.0" y="181" font-size="21" fill="#172033" text-anchor="middle">per channel</text><rect x="490" y="125" width="200" height="90" rx="6" fill="#f0fdf4" stroke="#94a3b8" stroke-width="2"/><text x="590.0" y="154" font-size="21" fill="#172033" text-anchor="middle">Global feature</text><text x="590.0" y="181" font-size="21" fill="#172033" text-anchor="middle">(3, 4)</text><path d="M230 170L251 170" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M455 170L482 170" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="295" width="200" height="130" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="125.0" y="324" font-size="21" fill="#172033" text-anchor="middle">Shuffled features</text><text x="125.0" y="351" font-size="21" fill="#172033" text-anchor="middle">(3, 2), (2, 1)</text><text x="125.0" y="378" font-size="21" fill="#172033" text-anchor="middle">(0, 4)</text><path d="M230 350L481 240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="292" y="340" font-size="24" fill="#172033" text-anchor="start" font-weight="bold">Same result</text><text x="292" y="388" font-size="20" fill="#172033" text-anchor="start">Not all geometry survives</text></g></svg>
