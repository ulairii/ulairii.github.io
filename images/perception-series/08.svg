<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Similar image size, different physical size</title><desc id="desc">A small nearby object and a larger distant object span the same angle at a camera.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="460" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">Similar image size, different physical size</text><circle cx="50" cy="285" r="9" fill="#475569"/><path d="M50 285L660 75" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M50 285L660 285" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M270 209L270 285" fill="none" stroke="#047857" stroke-width="9"/><path d="M560 109L560 285" fill="none" stroke="#c2410c" stroke-width="9"/><text x="170" y="335" font-size="22" fill="#172033" text-anchor="start">Small and near</text><text x="455" y="335" font-size="22" fill="#172033" text-anchor="start">Larger and far</text><text x="30" y="90" font-size="24" fill="#172033" text-anchor="start" font-weight="bold">Same angular extent</text><text x="30" y="388" font-size="24" fill="#172033" text-anchor="start">Image height alone does not determine distance.</text><text x="30" y="432" font-size="21" fill="#172033" text-anchor="start">A size estimate or additional measurement is needed.</text></g></svg>
