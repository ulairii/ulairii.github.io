<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="title desc"><title id="title">Three camera-to-3D routes</title><desc id="desc">Image features can produce object boxes directly, reconstruct points from depth, or lift features using depth weights.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="490" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">Three camera-to-3D routes</text><rect x="30" y="75" width="660" height="65" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="360.0" y="104" font-size="21" fill="#172033" text-anchor="middle">Camera image features</text><path d="M360 145L125 203" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="215" width="200" height="100" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="125.0" y="244" font-size="21" fill="#172033" text-anchor="middle">Object predictions</text><text x="125.0" y="271" font-size="21" fill="#172033" text-anchor="middle">Box geometry</text><path d="M360 145L360 203" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="215" width="200" height="100" rx="6" fill="#f0fdf4" stroke="#94a3b8" stroke-width="2"/><text x="360.0" y="244" font-size="21" fill="#172033" text-anchor="middle">Depth → points</text><text x="360.0" y="271" font-size="21" fill="#172033" text-anchor="middle">Point-cloud detector</text><path d="M360 145L595 203" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="215" width="200" height="100" rx="6" fill="#fff7ed" stroke="#94a3b8" stroke-width="2"/><text x="595.0" y="244" font-size="21" fill="#172033" text-anchor="middle">Depth weights</text><text x="595.0" y="271" font-size="21" fill="#172033" text-anchor="middle">Spatial feature grid</text><text x="25" y="370" font-size="24" fill="#172033" text-anchor="start" font-weight="bold">All routes must estimate missing geometry.</text><text x="25" y="417" font-size="22" fill="#172033" text-anchor="start">Inferred points are not direct lidar measurements.</text></g></svg>
