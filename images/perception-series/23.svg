<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc"><title id="title">A world model predicts action-dependent futures</title><desc id="desc">One current state branches into rollouts for slowing down or continuing; predicted futures require validation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="510" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">A world model predicts action-dependent futures</text><rect x="25" y="195" width="175" height="90" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="112.5" y="224" font-size="21" fill="#172033" text-anchor="middle">Current state</text><text x="112.5" y="251" font-size="21" fill="#172033" text-anchor="middle">Observations</text><rect x="270" y="75" width="170" height="75" rx="6" fill="#f0fdf4" stroke="#94a3b8" stroke-width="2"/><text x="355.0" y="104" font-size="21" fill="#172033" text-anchor="middle">Slow down</text><rect x="485" y="75" width="210" height="110" rx="6" fill="#f0fdf4" stroke="#94a3b8" stroke-width="2"/><text x="590.0" y="104" font-size="21" fill="#172033" text-anchor="middle">Predicted future A</text><text x="590.0" y="131" font-size="21" fill="#172033" text-anchor="middle">Not an observation</text><path d="M205 240L260 112" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M445 112L477 112" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="300" width="170" height="75" rx="6" fill="#fff7ed" stroke="#94a3b8" stroke-width="2"/><text x="355.0" y="329" font-size="21" fill="#172033" text-anchor="middle">Continue</text><rect x="485" y="300" width="210" height="110" rx="6" fill="#fff7ed" stroke="#94a3b8" stroke-width="2"/><text x="590.0" y="329" font-size="21" fill="#172033" text-anchor="middle">Predicted future B</text><text x="590.0" y="356" font-size="21" fill="#172033" text-anchor="middle">Not an observation</text><path d="M205 240L260 337" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M445 337L477 337" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="25" y="463" font-size="22" fill="#172033" text-anchor="start">Check geometry, action response, and error over time.</text></g></svg>
