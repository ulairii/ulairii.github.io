<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">One present, more than one possible future</title><desc id="desc">The cyclist can continue straight or turn. These are alternative forecasts rather than simultaneous facts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="480" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">One present, more than one possible future</text><rect x="25" y="180" width="185" height="90" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="117.5" y="209" font-size="21" fill="#172033" text-anchor="middle">Current cyclist</text><text x="117.5" y="236" font-size="21" fill="#172033" text-anchor="middle">Position + motion</text><path d="M215 210L338 132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M215 245L338 337" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="65" width="340" height="155" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="365" y="96" font-size="22" fill="#172033" text-anchor="start" font-weight="bold">Future A: straight</text><circle cx="390" cy="178" r="9" fill="#047857"/><rect x="350" y="270" width="340" height="155" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="365" y="301" font-size="22" fill="#172033" text-anchor="start" font-weight="bold">Future B: turn</text><circle cx="390" cy="383" r="9" fill="#047857"/><path d="M403 178L640 178" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><path d="M403 383H510Q600 383 600 326" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="25" y="460" font-size="23" fill="#172033" text-anchor="start">Forecast alternatives must remain distinct.</text></g></svg>
