<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">A track can bridge an observation gap</title><desc id="desc">Measured cyclist positions are solid; a dashed prediction during occlusion is less certain and must be updated.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="470" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">A track can bridge an observation gap</text><text x="30" y="94" font-size="24" fill="#172033" text-anchor="start" font-weight="bold">Time 1</text><rect x="30" y="120" width="180" height="200" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><path d="M45 280L195 280" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="270" y="94" font-size="24" fill="#172033" text-anchor="start" font-weight="bold">Time 2</text><rect x="270" y="120" width="180" height="200" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><path d="M285 280L435 280" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="510" y="94" font-size="24" fill="#172033" text-anchor="start" font-weight="bold">Time 3</text><rect x="510" y="120" width="180" height="200" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><path d="M525 280L675 280" fill="none" stroke="#94a3b8" stroke-width="2"/><rect x="75" y="215" width="40" height="60" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="2"/><rect x="330" y="200" width="40" height="60" rx="6" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/><rect x="590" y="185" width="40" height="60" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="2"/><text x="38" y="357" font-size="22" fill="#172033" text-anchor="start">Measured</text><text x="275" y="357" font-size="22" fill="#172033" text-anchor="start">Predicted</text><text x="515" y="357" font-size="22" fill="#172033" text-anchor="start">Measured</text><path d="M215 220L261 220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M455 220L501 220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="25" y="418" font-size="22" fill="#172033" text-anchor="start">An old track is a hypothesis, not a new observation.</text></g></svg>
