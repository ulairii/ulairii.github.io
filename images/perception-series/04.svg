<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">One pixel, several possible depths</title><desc id="desc">Two points along one ray have identical horizontal image position under pinhole projection.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="460" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">One pixel, several possible depths</text><circle cx="75" cy="320" r="9" fill="#475569"/><text x="25" y="362" font-size="21" fill="#172033" text-anchor="start">Camera</text><path d="M75 320L650 90" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M75 320L650 320" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M235 105L235 355" fill="none" stroke="#475569" stroke-width="3"/><text x="155" y="86" font-size="20" fill="#172033" text-anchor="start">Virtual image plane</text><circle cx="235" cy="256" r="8" fill="#c2410c"/><text x="247" y="284" font-size="21" fill="#c2410c" text-anchor="start">Same pixel</text><circle cx="325" cy="220" r="9" fill="#2563eb"/><text x="270" y="192" font-size="20" fill="#172033" text-anchor="start">(X, Z) = (1, 10)</text><circle cx="575" cy="120" r="9" fill="#047857"/><text x="490" y="87" font-size="20" fill="#172033" text-anchor="start">(2, 20)</text><text x="565" y="353" font-size="21" fill="#172033" text-anchor="start">Depth Z →</text><text x="25" y="407" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">u = f × X / Z + c</text><text x="340" y="407" font-size="21" fill="#172033" text-anchor="start">Both points have X/Z = 0.1</text></g></svg>
