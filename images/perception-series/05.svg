<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 495" role="img" aria-labelledby="title desc"><title id="title">Where detection shares computation</title><desc id="desc">R-CNN processes separate crops; Fast R-CNN shares features; Faster R-CNN learns proposals from those features.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="720" height="495" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="35" font-size="25" fill="#172033" text-anchor="start" font-weight="bold">Where detection shares computation</text><text x="25" y="85" font-size="23" fill="#172033" text-anchor="start" font-weight="bold">R-CNN</text><rect x="25" y="102" width="200" height="63" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="125.0" y="131" font-size="21" fill="#172033" text-anchor="middle">Region crops</text><path d="M229 133L252 133" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="102" width="200" height="63" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="360.0" y="131" font-size="21" fill="#172033" text-anchor="middle">CNN per crop</text><path d="M464 133L487 133" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="102" width="200" height="63" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="595.0" y="131" font-size="21" fill="#172033" text-anchor="middle">Boxes</text><text x="25" y="220" font-size="23" fill="#172033" text-anchor="start" font-weight="bold">Fast R-CNN</text><rect x="25" y="237" width="200" height="63" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="125.0" y="266" font-size="21" fill="#172033" text-anchor="middle">Image CNN</text><path d="M229 268L252 268" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="237" width="200" height="63" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="360.0" y="266" font-size="21" fill="#172033" text-anchor="middle">Region features</text><path d="M464 268L487 268" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="237" width="200" height="63" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="595.0" y="266" font-size="21" fill="#172033" text-anchor="middle">Boxes</text><text x="25" y="355" font-size="23" fill="#172033" text-anchor="start" font-weight="bold">Faster R-CNN</text><rect x="25" y="372" width="200" height="63" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="125.0" y="401" font-size="21" fill="#172033" text-anchor="middle">Image CNN</text><path d="M229 403L252 403" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="372" width="200" height="63" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="360.0" y="401" font-size="21" fill="#172033" text-anchor="middle">Learned proposals</text><path d="M464 403L487 403" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="372" width="200" height="63" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="595.0" y="401" font-size="21" fill="#172033" text-anchor="middle">Refine boxes</text><text x="25" y="475" font-size="18" fill="#172033" text-anchor="start">Each row is a simplified computation, not the full architecture.</text></g></svg>
