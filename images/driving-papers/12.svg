<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">Evaluation: what responds to the planned action?</title><desc id="desc">Open loop: Recorded scene → Predicted trajectory → Compare with log; Non-reactive rollout: Recorded actors → Advance ego vehicle → Score interaction; Interactive rollout: Simulated scene → Ego + actors respond → Observe and replan</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526577"/></marker></defs><rect width="760" height="460" fill="#fff"/><g font-family="Arial, sans-serif" fill="#24292e"><text x="22" y="34" font-size="23" font-weight="700">Evaluation: what responds to the planned action?</text><text x="22" y="80" font-size="21" font-weight="600">Open loop</text><rect x="22" y="94" width="222" height="70" rx="3" fill="#fafafa" stroke="#b7c2cc"/><text x="133" y="135" text-anchor="middle" font-size="21">Recorded scene</text><path d="M246 129h18" stroke="#526577" stroke-width="2" marker-end="url(#arrow)"/><rect x="268" y="94" width="222" height="70" rx="3" fill="#fafafa" stroke="#b7c2cc"/><text x="379" y="135" text-anchor="middle" font-size="21">Predicted trajectory</text><path d="M492 129h18" stroke="#526577" stroke-width="2" marker-end="url(#arrow)"/><rect x="514" y="94" width="222" height="70" rx="3" fill="#eef3f7" stroke="#b7c2cc"/><text x="625" y="135" text-anchor="middle" font-size="21">Compare with log</text><text x="22" y="202" font-size="21" font-weight="600">Non-reactive rollout</text><rect x="22" y="216" width="222" height="70" rx="3" fill="#fafafa" stroke="#b7c2cc"/><text x="133" y="257" text-anchor="middle" font-size="21">Recorded actors</text><path d="M246 251h18" stroke="#526577" stroke-width="2" marker-end="url(#arrow)"/><rect x="268" y="216" width="222" height="70" rx="3" fill="#fafafa" stroke="#b7c2cc"/><text x="379" y="257" text-anchor="middle" font-size="21">Advance ego vehicle</text><path d="M492 251h18" stroke="#526577" stroke-width="2" marker-end="url(#arrow)"/><rect x="514" y="216" width="222" height="70" rx="3" fill="#eef3f7" stroke="#b7c2cc"/><text x="625" y="257" text-anchor="middle" font-size="21">Score interaction</text><text x="22" y="324" font-size="21" font-weight="600">Interactive rollout</text><rect x="22" y="338" width="222" height="70" rx="3" fill="#fafafa" stroke="#b7c2cc"/><text x="133" y="379" text-anchor="middle" font-size="21">Simulated scene</text><path d="M246 373h18" stroke="#526577" stroke-width="2" marker-end="url(#arrow)"/><rect x="268" y="338" width="222" height="70" rx="3" fill="#fafafa" stroke="#b7c2cc"/><text x="379" y="379" text-anchor="middle" font-size="21">Ego + actors respond</text><path d="M492 373h18" stroke="#526577" stroke-width="2" marker-end="url(#arrow)"/><rect x="514" y="338" width="222" height="70" rx="3" fill="#eef3f7" stroke="#b7c2cc"/><text x="625" y="379" text-anchor="middle" font-size="21">Observe and replan</text><text x="22" y="445" font-size="17" fill="#555e67">Conceptual comparison; arrows summarize information flow.</text></g></svg>
